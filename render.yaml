services:
  - type: web
    name: festfund-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: https://festfund-vi-1.onrender.com,https://festfund-web.onrender.com
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        value: whatsapp:+14155238886
      - key: TWILIO_WHATSAPP_CONTENT_SID
        sync: false
      - key: TWILIO_STATUS_CALLBACK_URL
        value: https://festfund-api.onrender.com/api/whatsapp/webhook
      - key: WHATSAPP_DONATION_TEMPLATE_NAME
        value: festfund_donation_receipt
      - key: WHATSAPP_TEMPLATE_LANGUAGE
        value: en
      - key: WHATSAPP_BUSINESS_PHONE
        value: whatsapp:+14155238886
      - key: FESTFUND_PUBLIC_URL
        value: https://festfund-vi-1.onrender.com

  - type: web
    name: festfund-web
    runtime: static
    rootDir: client
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://festfund-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html